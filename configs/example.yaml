# mcpd configuration.
#
# Secrets are never written here. Each credential names a *reference* --
# env:NAME, credential:NAME (systemd LoadCredential), or file:/abs/path --
# which is resolved at startup. A config file that never holds a token cannot
# leak one into version control.

server:
  # Bind to loopback. mcpd expects a reverse proxy in front of it to terminate
  # TLS; binding publicly would serve MCP, and its bearer tokens, in plaintext.
  listen: "127.0.0.1:8080"

  # The address assistants reach the MCP endpoint at -- the `listen` port
  # above, not the dashboard. It identifies this resource in OAuth metadata
  # and is what the dashboard shows as a connection address, so it must match
  # what clients actually use or a connector handshake fails at the redirect.
  public_url: "https://mcp.example.net"

  tls:
    # off | self-signed
    #
    # Self-signed matters for a private deployment reached through a tunnel.
    # An OAuth issuer must be an https URL (RFC 8414) and a ChatGPT connector
    # refuses one that is not -- reporting only that the server "does not
    # implement OAuth", after fetching the metadata successfully, which makes
    # it a hard failure to read.
    #
    # A publicly trusted certificate cannot be issued for an address like
    # 192.168.1.10, so mcpd issues its own from a CA it keeps beside the
    # database. The CA is downloadable from the dashboard; the embedded tunnel
    # client is told about it directly. Leave this off when a reverse proxy in
    # front already terminates TLS.
    mode: off

  # Admin dashboard listener, separate from the MCP endpoint above.
  #
  # Agents reach MCP over a tunnel; operators reach the dashboard on an
  # internal interface. Keeping them on different ports is what lets a
  # firewall rule tell them apart.
  #
  # Binding below 1024 needs CAP_NET_BIND_SERVICE. The systemd unit grants it;
  # under Docker the container binds 8081 and the host publishes 80.
  frontend_listen: ":80"
  frontend_enabled: true

  read_header_timeout: 10s
  read_timeout: 60s
  write_timeout: 120s
  idle_timeout: 120s
  shutdown_timeout: 30s

storage:
  path: /var/lib/mcpd/mcpd.db

  # Reader pool size. Zero derives it from GOMAXPROCS. Reads never block behind
  # the writer under WAL, so this is what governs tool-call concurrency.
  read_pool_size: 0

  busy_timeout: 5s

  # Leave false. Under WAL, relaxed durability can lose the most recent
  # transactions on power loss -- and those transactions authorise
  # infrastructure changes.
  relaxed_durability: false

# Key used to encrypt secrets stored in the database, so they can be set from
# the dashboard without landing in plaintext beside the data they protect. The
# key stays outside the database, which is what makes a stolen copy useless.
#
# Generate one with:  openssl rand -base64 32
secret_key_ref: env:MCPD_SECRET_KEY

auth:
  # static | oauth | mixed
  #
  # A ChatGPT connector needs oauth or mixed. The connector asks mcpd for
  # protected-resource metadata before it will be created at all, and under
  # static auth there is none to give -- ChatGPT reports that the server does
  # not implement OAuth and stops there.
  mode: static

  static_tokens:
    # Scoping is per credential. This agent can reach /mcp/cnmaestro and
    # nothing else: other endpoints return 404, so it cannot even discover
    # which other integrations are deployed.
    - id: chatgpt-cnmaestro
      secret_ref: env:MCPD_TOKEN_CHATGPT
      principal: svc:chatgpt
      role: operator
      plugins:
        - cnmaestro

    - id: diagnostics
      secret_ref: credential:diagnostics
      principal: svc:diagnostics
      role: viewer
      plugins:
        - echo

  # mcpd is its own OAuth authorization server. Set mode to "oauth" for the
  # ChatGPT connector, or "mixed" to keep static tokens working alongside it.
  oauth:
    # Defaults to server.public_url, which is almost always right.
    issuer: ""

    access_token_ttl: 1h
    refresh_token_ttl: 720h
    auth_code_ttl: 1m
    session_ttl: 30m

    # ChatGPT registers itself via RFC 7591. This is safe to leave on:
    # registering confers nothing by itself, since a client still cannot get a
    # token without a user completing the consent screen, and the token it
    # receives is bounded by that user's own role and plugin grants.
    allow_dynamic_registration: true

    # Client ID Metadata Documents, which supersede dynamic registration in the
    # 2026-07-28 MCP revision.
    allow_cimd: true

    # Creates the first administrator, and only on a genuinely empty database.
    # Ignored once any identity exists, so it cannot reset a live account.
    bootstrap:
      username: admin
      password_ref: env:MCPD_BOOTSTRAP_PASSWORD

approval:

  # How long a proposal waits for a decision.
  proposal_ttl: 30m

  # How long an approval stays executable. Without this, an approval granted
  # weeks ago could still execute against a network that has since changed.
  approval_ttl: 15m

  # How long an execution claim is held before the reaper reclaims it.
  lease_ttl: 2m

  # Highest risk a user may approve from a single yes/no prompt raised by
  # their assistant. Above it the shortcut is withheld, not the decision: the
  # assistant has to show the change in full and be told explicitly. Either way
  # the person decides in the conversation.
  inline_max_risk: medium

logging:
  level: info
  format: json

# OpenAI's Secure MCP Tunnel, running inside mcpd.
#
# This is how ChatGPT reaches mcpd without an inbound port, public DNS, or a
# NAT rule: the connection is dialled outward and held open. It runs in this
# process over an in-memory transport, so requests never touch a socket and
# there is no local address for anything else to find.
#
# Because there is no HTTP request to authenticate, what the tunnel may reach
# is decided here rather than by a bearer token.
tunnel:
  enabled: false

  # How the tunnel reaches mcpd follows from auth.mode above, and is not
  # configured here.
  #
  # Under static auth it runs the MCP server in this process over an in-memory
  # transport: no port, no socket, no credential. With OAuth mounted it binds
  # to server.public_url instead, because protected-resource discovery is a
  # command the tunnel client executes against a URL and an in-memory binding
  # has none. That also puts every OAuth endpoint on one origin, which is what
  # lets the tunnel reach an authorization server on a private address.

  # From platform.openai.com -> Settings -> Organization -> Tunnels.
  tunnel_id: ""

  # A *runtime* API key, referenced not written. An admin key is only for
  # creating and deleting tunnels and must not be used for the connection.
  api_key_ref: env:OPENAI_TUNNEL_API_KEY

  # The identity requests through the tunnel act as. This is the whole of its
  # authorization, so be specific: everyone using the connector shares it.
  principal: svc:chatgpt
  role: operator
  plugins:
    - cnmaestro

  # Report when a newer tunnel client is released. It only reports -- the
  # client is compiled in, so picking one up means rebuilding mcpd, which is
  # the point: the code that runs is the code that was built and reviewed.
  check_for_updates: true

plugins:
  # A test connection for checking that everything works. It touches nothing
  # outside mcpd. Turn it on while setting up, then turn it off.
  echo:
    enabled: false
    required: false

  cnmaestro:
    enabled: false
    # required: true means a startup failure here fails the whole host.
    # Leave false so an upstream outage marks only this plugin unhealthy.
    required: false
    settings:
      base_url: "https://cloud.cambiumnetworks.com"
      client_id_ref: env:MCPD_CNMAESTRO_CLIENT_ID
      client_secret_ref: env:MCPD_CNMAESTRO_CLIENT_SECRET
