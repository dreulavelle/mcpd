# mcpd configuration.
#
# Secrets are never written here. Each credential names a *reference* --
# env:NAME, credential:NAME (systemd LoadCredential), or file:/abs/path --
# which is resolved at startup. A config file that never holds a token cannot
# leak one into version control.

server:
  # Bind to loopback. mcpd expects a reverse proxy in front of it to terminate
  # TLS; binding publicly would serve MCP, and its bearer tokens, in plaintext.
  listen: "127.0.0.1:8080"

  # The address assistants reach the MCP endpoint at -- the `listen` port
  # above, not the dashboard. It is what the dashboard shows as a connection
  # address, so it must match what clients actually use.
  #
  # Behind a proxy that terminates TLS this is not cosmetic. mcpd is reached
  # over plain HTTP in that shape, so it cannot tell from the connection that
  # browsers are speaking https -- and this is what tells it the dashboard's
  # session cookie needs Secure. X-Forwarded-Proto deliberately does not
  # count: a header is set by whoever is talking to this process, and nothing
  # here can tell a proxy's from a caller's.
  public_url: "https://mcp.example.net"

  tls:
    # off | self-signed
    #
    # Self-signed matters for a private deployment: a bearer token has no
    # business crossing even a private network in the clear.
    #
    # A publicly trusted certificate cannot be issued for an address like
    # 192.168.1.10, so mcpd issues its own from a CA it keeps beside the
    # database. The CA is downloadable from the dashboard; the embedded tunnel
    # client is told about it directly. Leave this off when a reverse proxy in
    # front already terminates TLS.
    mode: off

  # Admin dashboard listener, separate from the MCP endpoint above.
  #
  # Agents reach MCP over a tunnel; operators reach the dashboard on an
  # internal interface. Keeping them on different ports is what lets a
  # firewall rule tell them apart.
  #
  # Binding below 1024 needs CAP_NET_BIND_SERVICE. The systemd unit grants it;
  # under Docker the container binds 8081 and the host publishes 80.
  frontend_listen: ":80"
  frontend_enabled: true

  read_header_timeout: 10s
  read_timeout: 60s
  write_timeout: 120s
  idle_timeout: 120s
  shutdown_timeout: 30s

storage:
  path: /var/lib/mcpd/mcpd.db

  # Reader pool size. Zero derives it from GOMAXPROCS. Reads never block behind
  # the writer under WAL, so this is what governs tool-call concurrency.
  read_pool_size: 0

  busy_timeout: 5s

  # Leave false. Under WAL, relaxed durability can lose the most recent
  # transactions on power loss -- and those transactions authorise
  # infrastructure changes.
  relaxed_durability: false

# Key used to encrypt secrets stored in the database, so they can be set from
# the dashboard without landing in plaintext beside the data they protect. The
# key stays outside the database, which is what makes a stolen copy useless.
#
# Generate one with:  openssl rand -base64 32
secret_key_ref: env:MCPD_SECRET_KEY

auth:
  # People sign in to the dashboard with their own email and password. Roles
  # and plugin grants are per account, so two people sharing a connector are
  # still two identities in the history.
  accounts:
    session_ttl: 12h

  # Bearer tokens for machine callers that cannot complete a sign-in form.
  # ChatGPT does not need one: the tunnel authenticates itself to OpenAI's
  # control plane, and carries its identity from the tunnel block below.
  static_tokens:
    # Scoping is per credential. This agent can reach /mcp/echo and nothing
    # else: other endpoints return 404, so it cannot even discover which other
    # integrations are deployed.
    - id: chatgpt-echo
      secret_ref: env:MCPD_TOKEN_CHATGPT
      principal: svc:chatgpt
      role: user
      plugins:
        - echo

    - id: diagnostics
      secret_ref: credential:diagnostics
      principal: svc:diagnostics
      role: user
      plugins:
        - echo

approval:

  # How long a proposal waits for a decision.
  proposal_ttl: 30m

  # How long an approval stays executable. Without this, an approval granted
  # weeks ago could still execute against a network that has since changed.
  approval_ttl: 15m

  # How long an execution claim is held before the reaper reclaims it.
  lease_ttl: 2m

  # Highest risk a user may approve from a single yes/no prompt raised by
  # their assistant. Above it the shortcut is withheld, not the decision: the
  # assistant has to show the change in full and be told explicitly. Either way
  # the person decides in the conversation.
  inline_max_risk: medium

logging:
  level: info
  format: json

# OpenAI's Secure MCP Tunnel, running inside mcpd.
#
# This is how ChatGPT reaches mcpd without an inbound port, public DNS, or a
# NAT rule: the connection is dialled outward and held open. It runs in this
# process over an in-memory transport, so requests never touch a socket and
# there is no local address for anything else to find.
#
# Because there is no HTTP request to authenticate, what the tunnel may reach
# is decided here rather than by a bearer token.
tunnel:
  enabled: false

  # The tunnel runs the MCP server in this process over an in-memory
  # transport: no port, no socket, no credential, and mcpd stays private.
  #
  # There is no option to bind it to a public address so a connector can sign
  # people in. That needed an authorization server reachable from the internet,
  # which is the one thing a tunnel exists to avoid -- OpenAI's documentation
  # is explicit that the authorization server "is not automatically tunneled".

  # Tunnels are normally made and assigned on the dashboard's Tunnels page,
  # which needs an admin key and an organization id set there. This is the
  # fallback for a deployment that would rather not give mcpd an admin key:
  # make the tunnel in the OpenAI console and name it here.
  #
  # From platform.openai.com -> Settings -> Organization -> Tunnels.
  tunnel_id: ""

  # A *runtime* API key, referenced not written. An admin key is only for
  # creating and deleting tunnels and must not be used for the connection.
  api_key_ref: env:OPENAI_TUNNEL_API_KEY

  # How ChatGPT is labelled in the history. Everyone using the connector
  # shares it, so it names the connector rather than a person.
  principal: svc:chatgpt
  # user, because approval happens in the conversation and this is what carries
  # the answer back. admin would additionally let it change this host's own
  # settings, which is almost never what you want for a connector.
  role: user
  plugins:
    - echo

  # Report when a newer tunnel client is released. It only reports -- the
  # client is compiled in, so picking one up means rebuilding mcpd, which is
  # the point: the code that runs is the code that was built and reviewed.
  check_for_updates: true

# Where the dashboard's server catalogue reads from.
#
# The catalogue is how an operator picks a remote MCP server instead of
# hand-authoring a server.json for one somebody else already published.
# Selecting an entry hands its document to the same import endpoint a paste
# goes through; there is no second way in.
#
# Four sources. Three are on: none is contacted at startup, and none is
# contacted at all until an administrator opens the page, so leaving them on in
# a deployment that never browses costs nothing. Turn one off if this host
# should not reach it; turn all of them off and the catalogue endpoints answer
# "no server catalogue is configured", which is the right answer for a
# deployment with no route to the internet.
#
# The order they are listed in below is preference order, and it decides which
# copy of a server survives when more than one catalogue has it: the entry kept
# is the one closest to the party that operates the server. Deduplication is by
# address rather than by name, because no rule turns "app.linear/linear" into
# "linear".
catalog:
  # registry.modelcontextprotocol.io, where a publisher registers a server
  # themselves. Free and unauthenticated.
  official: true

  # PulseMCP's v0.1 sub-registry: around 22,000 servers, and the same wire
  # format the official registry serves, so a document arrives as its publisher
  # wrote it rather than composed here.
  #
  # Off by default, and it is the only one that is, because v0.1 authenticates
  # every request -- a deployment without a key would get a page of 401s rather
  # than a catalogue. PulseMCP issues a key and tenant id by email
  # (hello@pulsemcp.com); mcpd will not start with this on and either missing.
  #
  # The older unauthenticated v0beta API is deliberately not used: PulseMCP is
  # failing a rising share of its requests on purpose and switches it off
  # entirely in September 2026.
  pulsemcp: false
  # pulsemcp_api_key_ref: env:PULSEMCP_API_KEY
  # pulsemcp_tenant: your-tenant-id

  # Docker's MCP catalogue, built from github.com/docker/mcp-registry (MIT).
  # No daemon and no container is involved: reading it is an HTTPS fetch of a
  # metadata document like any other. Most of what it lists runs locally and is
  # shown with the reason rather than offered; the remote entries are the ones
  # this host can actually connect to.
  docker: true

  # Smithery's registry: around 10,500 servers, every hosted one reachable at
  # server.smithery.ai and opened by a single Smithery API key.
  #
  # Browsing needs no credential, which is why this is on by default. Dialling
  # one of these servers does, and each entry says so -- the key is asked for at
  # import, as an ordinary encrypted settings field, once per server imported.
  #
  # Smithery's own listing stops after 500 of those 10,500 servers however it is
  # asked, so a browse says it is truncated and search is how the rest are
  # reached; a search is passed to Smithery rather than applied to the 500.
  smithery: true

# Each key is an instance name, and `type` says what it is an instance of.
# Leave `type` out and the two are the same, which is the ordinary case.
#
# Two instances of one integration are two plugins to the host: two endpoints,
# two entries in a credential's `plugins` list, two connectors, and a history
# that says which one acted.
#
#   nas-primary:
#     type: synology
#     settings: { host: 10.0.0.10 }
#   nas-backup:
#     type: synology
#     settings: { host: 10.0.0.11 }
plugins:
  # A test connection for checking that everything works. It touches nothing
  # outside mcpd. Turn it on while setting up, then turn it off.
  echo:
    enabled: false
    # required: true means a startup failure here fails the whole host.
    # Leave false so an upstream outage marks only this plugin unhealthy.
    required: false

  # Out-of-process plugins are discovered from plugins_dir and named here the
  # same way. A plugin's own settings go under `settings`, and it decides what
  # they mean.

  # Cambium cnMaestro. Read-only: it lists networks and devices and will not
  # run commands on hardware.
  cnmaestro:
    enabled: false
    required: false
    # A plugin's own settings -- credentials, addresses, tuning -- are declared
    # by the plugin and edited on the Plugins page, where they are validated and
    # secrets are encrypted at rest. A `settings:` block here is only a starting
    # value for a host nobody has opened yet; a secret in one should be a
    # reference, written as <field>_ref.
