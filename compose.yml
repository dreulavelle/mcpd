name: mcpd

services:
  mcpd:
    build:
      context: .
    image: ghcr.io/dreulavelle/mcpd:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MCPD_FRONTEND_LISTEN: ":8081"
    ports:
      - "${MCPD_BIND:-127.0.0.1}:${MCPD_PORT:-8080}:8080"
      - "${MCPD_FRONTEND_BIND:-127.0.0.1}:${MCPD_FRONTEND_PORT:-80}:8081"
      - "127.0.0.1:${MCPD_TUNNEL_DIAGNOSTICS_PORT:-9099}:9099"
    volumes:
      # Must be owned by 65532 -- the image is distroless nonroot, and a
      # directory owned by the host user is not writable by it:
      #   mkdir -p .data && docker run --rm -v "$PWD/.data":/d alpine chown -R 65532:65532 /d
      - ./.data:/var/lib/mcpd
      - ./config.yaml:/etc/mcpd/config.yaml:ro
      - ./plugins:/var/lib/mcpd/plugins:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/mcpd", "-config", "/etc/mcpd/config.yaml", "-check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 60s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

