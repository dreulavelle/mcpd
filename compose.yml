name: mcpd

services:
  mcpd:
    build: .
    image: ghcr.io/dreulavelle/mcpd:local
    container_name: mcpd
    restart: unless-stopped
    # Owns ./data. Set UID/GID in .env if your account is not uid 1000.
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - path: .env
        required: false
    environment:
      MCPD_LISTEN: ":8080"
      MCPD_FRONTEND_LISTEN: ":8081"
      # The container is capped at 1g, and out-of-process plugins are children
      # sharing that cgroup, so the Go heap is given 768MiB rather than all of
      # it. Without a limit the runtime never learns the ceiling exists: it
      # collects against heap doubling and hands freed spans back to the OS
      # lazily, which reads on the dashboard as resident memory that only
      # ratchets upward. A soft limit makes the collector work to stay under it.
      GOMEMLIMIT: "${MCPD_MEMLIMIT:-768MiB}"
    ports:
      - "${MCPD_PORT:-8080}:8080"
      - "${MCPD_FRONTEND_PORT:-80}:8081"
    # Config, database, TLS material, logs and plugins. Back this up.
    volumes:
      - ./data:/var/lib/mcpd
    # Not an HTTP probe: with self-signed TLS the listener speaks mcpd's own CA.
    healthcheck:
      test: ["CMD", "/usr/local/bin/mcpd", "-config", "/var/lib/mcpd/config.yaml", "-check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 60s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
