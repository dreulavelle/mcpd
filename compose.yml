name: mcpd

services:
  mcpd:
    # No version argument: the binary carries its own. A release is stamped
    # by CI from the tag it is built at, and a build from a working tree
    # derives one from the release manifest in the source. An environment
    # variable naming a version is a second answer that nothing keeps true.
    build:
      context: .
    image: ghcr.io/dreulavelle/mcpd:local
    container_name: mcpd
    restart: unless-stopped

    # Owns ./data. Override in .env if your account is not uid 1000 — the
    # shell does not export these, so compose cannot work them out.
    user: "${UID:-1000}:${GID:-1000}"

    env_file:
      - path: .env
        required: false

    # Bind every interface inside the container; the port mappings below
    # decide what the host actually exposes.
    environment:
      MCPD_LISTEN: ":8080"
      MCPD_FRONTEND_LISTEN: ":8081"

    ports:
      - "${MCPD_BIND:-127.0.0.1}:${MCPD_PORT:-8080}:8080"
      - "${MCPD_FRONTEND_BIND:-127.0.0.1}:${MCPD_FRONTEND_PORT:-80}:8081"

    # config.yaml, the database, TLS material and plugins. Generated on first
    # start if empty.
    volumes:
      - ./data:/var/lib/mcpd

    # Not an HTTP probe: with self-signed TLS the listener speaks mcpd's own
    # CA, and a probe failing on that would report a healthy host as sick.
    healthcheck:
      test: ["CMD", "/usr/local/bin/mcpd", "-config", "/var/lib/mcpd/config.yaml", "-check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Headroom over the 30s drain budget in Settings -> Timeouts.
    stop_grace_period: 60s

    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    deploy:
      resources:
        limits:
          memory: 1g

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
