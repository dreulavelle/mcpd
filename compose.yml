# mcpd via Docker Compose.
#
#   cp .env.example .env
#   $EDITOR .env            # at minimum, set MCPD_TOKEN_LOCAL
#   docker compose up -d
#
# Secrets live in .env and are read two ways: Compose interpolates the few it
# needs for ports and image tags, and env_file passes the whole file into the
# container, where mcpd resolves the `env:` references in its config.
#
# Nothing here publishes the MCP endpoint beyond loopback. To reach it from
# ChatGPT, use OpenAI's Secure MCP Tunnel -- see the `tunnel` profile below --
# which connects outbound and needs no inbound port at all.

name: mcpd

services:
  mcpd:
    build:
      context: .
    image: ghcr.io/dreulavelle/mcpd:local
    restart: unless-stopped

    # The whole file is passed through, so any `env:` reference in config.yaml
    # resolves without naming each variable here.
    env_file:
      - path: .env
        required: false

    environment:
      # Overrides server.frontend_listen so the container binds an
      # unprivileged port while the host publishes 80. Keeps the container's
      # capability set empty.
      MCPD_FRONTEND_LISTEN: ":8081"

    ports:
      # MCP endpoint. Loopback by default: mcpd speaks plain HTTP and carries
      # bearer tokens, so it belongs behind TLS or a tunnel. Set MCPD_BIND to
      # a LAN address to reach it directly during development.
      - "${MCPD_BIND:-127.0.0.1}:${MCPD_PORT:-8080}:8080"

      # Admin dashboard. Bind it to a specific interface if this host faces
      # anything untrusted:  - "10.0.0.5:80:8081"
      - "${MCPD_FRONTEND_BIND:-127.0.0.1}:${MCPD_FRONTEND_PORT:-80}:8081"

    volumes:
      # Database and all mutable state. Named rather than bind-mounted so the
      # nonroot container user owns it without host-side chown.
      - mcpd-data:/var/lib/mcpd

      # Your own config, not the repo's example. Start from it:
      #   cp configs/example.yaml config.yaml
      - ./config.yaml:/etc/mcpd/config.yaml:ro

      # Out-of-process plugins. Read-only: mcpd only ever executes what is
      # here, and a writable mount would let anything that can write to the
      # host replace a reviewed integration.
      - ./plugins:/var/lib/mcpd/plugins:ro

    healthcheck:
      # mcpd answers its own readiness probe, so the check needs no shell and
      # no curl in an image that has neither.
      test: ["CMD", "/usr/local/bin/mcpd", "-config", "/etc/mcpd/config.yaml", "-check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    stop_grace_period: 60s

    # The container writes to exactly one place. Everything else is read-only,
    # which removes the usual foothold after a compromise.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    deploy:
      resources:
        limits:
          memory: 1g

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # OpenAI's Secure MCP Tunnel. Connects outbound to OpenAI and forwards
  # JSON-RPC to mcpd, so ChatGPT can reach it with no inbound port, no public
  # DNS, and no NAT rule.
  #
  #   docker compose --profile tunnel up -d
  #
  # Create the tunnel and a runtime API key at
  # platform.openai.com/settings/organization/tunnels, then attach it in
  # ChatGPT under Plugins -> create a developer-mode app -> Connection: Tunnel.
  tunnel:
    profiles: ["tunnel"]
    image: ghcr.io/openai/tunnel-client:latest
    restart: unless-stopped

    env_file:
      - path: .env
        required: false

    environment:
      # Deliberately not guarded with `:?`. Compose interpolates every service
      # even when its profile is inactive, so a required-variable guard here
      # would block `docker compose up` for anyone who never wants a tunnel.
      # tunnel-client reports a missing key clearly on its own.
      CONTROL_PLANE_API_KEY: ${OPENAI_TUNNEL_API_KEY:-}
      CONTROL_PLANE_TUNNEL_ID: ${OPENAI_TUNNEL_ID:-}

      # The aggregate endpoint, so one tunnel serves every integration the
      # token is granted rather than needing one tunnel per plugin.
      #
      # Scoping still comes from the token, not the path: point this at a
      # credential limited to one integration and the connector sees exactly
      # that one. To split them deliberately, use /mcp/<plugin> and a token
      # scoped to match.
      MCP_SERVER_URL: http://mcpd:8080/mcp

      # tunnel-client injects this on every forwarded request, so mcpd's
      # ordinary bearer authentication works through the tunnel with no OAuth
      # and nothing public. Header values accept env: and file: references.
      MCP_EXTRA_HEADERS: "Authorization: Bearer ${MCPD_TOKEN_LOCAL:-}"

      # mcpd binds after the tunnel container may start, so hold the first
      # poll until the listener is reachable.
      MCP_STARTUP_WAIT_TIMEOUT: 60s

    depends_on:
      mcpd:
        condition: service_healthy

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mcpd-data:
