# Refreshes the Skills board the dashboard renders.
#
# It opens a pull request and merges its own, so the change is auditable and
# revertable without anybody having to be awake on a Monday. What that gives up
# is a person looking at the diff, so the checks that person was performing are
# done in the job instead: the page's own tests run against the new snapshot
# before the pull request exists, and the fetch refuses data that parsed but
# cannot be true -- an all-time count that fell, or a board sharing almost
# nothing with the one before it. A refused run writes nothing and fails loudly.
#
# The dashboard bundle is not committed -- the image build compiles it from
# `web/` -- so this changes one file and the next release picks it up. The
# commit is a `chore`, which the changelog hides, so a weekly refresh does not
# churn releases.
name: Skills snapshot

on:
  schedule:
    # Mondays, early. Nothing depends on the hour; it only wants to be a
    # different one from every other job in this repository.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Three un-timed fetches; a hung one should not hold a runner all day.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The script throws rather than writing a short or empty board, so a
      # failure here leaves the committed snapshot standing.
      - name: Fetch the boards
        run: node web/scripts/fetch-skills.mjs

      # A pull request opened with the default token does not start
      # `on: pull_request`, so ci.yml never sees this branch. Without this the
      # only thing between a changed page shape and main is somebody skimming
      # a fifteen-thousand-line diff. The page's tests read the snapshot
      # through resolveJsonModule, so a board of the wrong shape fails here.
      - name: Check the snapshot against the page
        run: cd web && npm ci --silent && npm test

      - uses: peter-evans/create-pull-request@v7
        id: pr
        with:
          branch: chore/skills-snapshot
          base: main
          # Not a conventional commit: GitHub puts the PR title into the merge
          # commit body and release-please reads that line too, which is how
          # 0.18.0 and 0.19.1 each shipped one entry twice.
          title: "Weekly skills snapshot"
          commit-message: |
            chore(web): refresh the skills snapshot

            Ranked installs from skills.sh, captured by the weekly job. The
            dashboard reads this file rather than calling out from a customer's
            host, so the numbers only move when this lands.
          body: |
            The weekly refresh of `web/src/data/skills.json`, merged by the job
            that opened it.

            Nobody reviewed this, so the checks a reviewer would have made were
            made before it existed: the page's own tests ran against this
            snapshot, and the fetch refuses data that parsed but cannot be true
            -- an all-time count that fell, or a board sharing almost nothing
            with the one before it.

            The numbers come out of a page's streamed payload rather than an
            API. If that page changes shape the run fails and writes nothing,
            which is why this landing at all is itself a signal that it did not.
          add-paths: web/src/data/skills.json

      # Merged here rather than through GitHub's auto-merge, which without
      # required status checks on main would merge the moment it was asked and
      # gate on nothing at all. The gate is the step above this one.
      #
      # Squashed, and the subject is the conventional commit release-please
      # reads. The pull request's own title deliberately is not one, so the
      # merge cannot put a second copy of it in the changelog.
      - name: Merge it
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          gh pr merge "$PR" --squash --delete-branch \
            --subject "chore(web): refresh the skills snapshot" \
            --body "Ranked installs from skills.sh, captured by the weekly job."
