# Runs the published image instead of building from source.
#   docker compose -f docker-compose.prod.yml up -d
name: mcpd

services:
  mcpd:
    # Pin it: MCPD_VERSION=0.5.0 in .env. The default tracks the latest release.
    image: ghcr.io/dreulavelle/mcpd:${MCPD_VERSION:-latest}
    pull_policy: always
    container_name: mcpd
    restart: unless-stopped
    # Owns ./data. Set UID/GID in .env if your account is not uid 1000.
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - path: .env
        required: false
    environment:
      MCPD_LISTEN: ":8080"
      MCPD_FRONTEND_LISTEN: ":8081"
    ports:
      - "${MCPD_PORT:-8080}:8080"
      - "${MCPD_FRONTEND_PORT:-80}:8081"
    # Config, database, TLS material and plugins. Back this up.
    volumes:
      - ./data:/var/lib/mcpd
    # Not an HTTP probe: with self-signed TLS the listener speaks mcpd's own CA.
    healthcheck:
      test: ["CMD", "/usr/local/bin/mcpd", "-config", "/var/lib/mcpd/config.yaml", "-check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 60s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
